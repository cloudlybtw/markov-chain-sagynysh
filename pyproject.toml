[project]
name = "sagynysh"
version = "0.1.0"
description = "Сглыпа-style Markov chain Telegram bot for a private friend group"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4",
    "aiosqlite>=0.20",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sagynysh"]
